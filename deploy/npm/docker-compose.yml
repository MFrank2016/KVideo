services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: kvideo-nginx-proxy-manager
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

networks:
  default:
    external: true
    name: kvideo-proxy
